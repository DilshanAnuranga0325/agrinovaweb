<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AgriNova</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#f0f4f0] min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Abstract Background shapes -->
    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-primary/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-secondary/20 rounded-full blur-3xl"></div>
    
    <div class="max-w-md w-full bg-white rounded-[2rem] p-10 shadow-2xl relative z-10 animate-fade-up">
        <div class="text-center mb-10">
            <div class="mb-6 mx-auto w-fit">
                <img src="assets/images/Logo.png" 
                     alt="AgriNova Logo" 
                     class="w-20 h-20 rounded-3xl object-cover shadow-xl">
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">AgriNova</h1>
            <p class="text-gray-500">Sign in to access your farm intelligence dashboard.</p>
        </div>

        <button id="googleLoginBtn" class="w-full flex items-center justify-center gap-3 border border-gray-200 py-4 px-6 rounded-2xl font-semibold text-gray-700 hover:bg-gray-50 transition-all hover:border-gray-300 active:scale-95 mb-4">
            <svg class="w-5 h-5" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
            </svg>
            Continue with Google
        </button>

        <p id="loginStatus" class="text-center text-sm text-primary font-medium mb-2"></p>
        <p id="loginError" class="text-center text-sm text-red-500 font-medium mb-4"></p>

        <div class="relative flex items-center justify-center mb-6">
            <div class="flex-grow border-t border-gray-100"></div>
            <span class="px-4 text-xs font-bold text-gray-400 uppercase tracking-widest">or</span>
            <div class="flex-grow border-t border-gray-100"></div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">Email Address</label>
                <input type="email" placeholder="farmer@agrinova.com" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-4 px-6 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all">
            </div>
            <button class="w-full bg-primary text-white py-4 px-6 rounded-2xl font-semibold hover:opacity-95 active:scale-95 transition-all shadow-lg shadow-primary/20">
                Continue with Email
            </button>
        </div>

        <p class="text-center text-sm text-gray-500 mt-8">
            Don't have an account? <a href="#" class="text-primary font-bold hover:underline">Request Access</a>
        </p>
    </div>

    <!-- Auth script -->
    <script type="module">
        import { redirectIfLoggedIn } from './js/auth.js';
        redirectIfLoggedIn();
    </script>
    <script type="module" src="./js/auth.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
